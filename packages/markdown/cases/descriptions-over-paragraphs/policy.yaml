ergo_spec: v0.4-dev
description: |-
  Every batch that leaves the bakery is safe to eat.

  The bakery's allergy promise covers nuts. Other allergens have their own policy.
subjects:
  batch:
    description: |-
      A batch of cakes baked today.

      One batch is one tray, as the oven logs it.
    from: batches
    identified_by: id
requirements:
  cake batch:
    description: |-
      Cakes are safe to eat.

      A customer with a nut allergy relies on this. A batch that can't show its allergens fails.
    subject: batch
    checks:
      nut free:
        description: Must not contain nut allergens.
        assert: allergens does not contain "nuts"
