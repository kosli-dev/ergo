[package]
name = "ergo-policy-cli"
description = "Experimental: prints Ergo reports and violations from policy, input and params files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ergo"
path = "src/main.rs"

[dependencies]
ergo-policy-engine = { path = "../engine" }
saphyr-parser = "0.3"
serde_json = { version = "1", features = ["arbitrary_precision"] }
