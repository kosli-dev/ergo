[workspace]
members = ["sentences", "engine", "wasm"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/kosli-dev/ergo"
publish = false

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
