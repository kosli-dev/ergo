[package]
name = "ergo-sentences-wasm"
description = "Experimental: reads Ergo's check sentences in a browser, from and to JSON text"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ergo-sentences = { path = "../sentences", features = ["serde"] }
serde = "1"
serde_json = "1"
wasm-bindgen = "=0.2.129"
