[package]
name = "ergo-python"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "_ergo"
crate-type = ["cdylib"]

[dependencies]
ergo = { path = "../rust" }
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
