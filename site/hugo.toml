baseURL = "https://ergo.kosli.com/"
languageCode = "en-gb"
title = "ergo"
disableKinds = ["taxonomy", "term", "rss"]

[params]
  description = "ergo is an open source language for writing explainable policies. Instead of a binary result, every decision returns an audit report of what was checked, and why it passed or failed."
  repo = "https://github.com/kosli-dev/ergo"
  fork = "https://github.com/kosli-dev/ergo/fork"
  opaVersion = "1.19"

[markup.goldmark.renderer]
  unsafe = true
[markup.highlight]
  noClasses = false
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

# The docs are read straight from the repo's own README.md and REFERENCE.md,
# so the site can never drift from the library.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "../README.md"
    target = "assets/repo/README.md"
  [[module.mounts]]
    source = "../REFERENCE.md"
    target = "assets/repo/REFERENCE.md"
  [[module.mounts]]
    source = "../examples"
    target = "assets/examples"
