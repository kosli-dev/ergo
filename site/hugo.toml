baseURL = "https://ergo.kosli.com/"
languageCode = "en-gb"
title = "Ergo"
disableKinds = ["taxonomy", "term", "rss"]

[params]
  description = "Ergo is an open source language for writing explainable policies. Instead of a binary result, every decision returns an audit report of what was checked, and why it passed or failed."
  repo = "https://github.com/kosli-dev/ergo"
  fork = "https://github.com/kosli-dev/ergo/fork"
  opaVersion = "1.20"

[markup.goldmark.renderer]
  unsafe = true
[markup.highlight]
  noClasses = false
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[module]
  [[module.mounts]]
    source = "prepared/content"
    target = "content"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "prepared/layouts"
    target = "layouts"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "prepared/assets"
    target = "assets"
  [[module.mounts]]
    source = "prepared/data"
    target = "data"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "prepared/repo"
    target = "assets/repo"
  [[module.mounts]]
    source = "prepared/examples"
    target = "assets/examples"
