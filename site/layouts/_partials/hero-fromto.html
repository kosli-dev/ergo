{{- $c := .Params.hero }}
<figure class="term ft" data-fromto aria-roledescription="carousel" aria-label="{{ $c.fromto.label }}">
  <div class="term__bar ft__bar">
    <span></span><span></span><span></span>
    <code class="ft__file" data-file></code>
    <div class="ft__tabs" role="group" aria-label="Examples">
      {{- range $i, $e := $c.fromto.examples }}
      <button class="ft__tab mono" type="button" data-ex="{{ $e.key }}" aria-pressed="{{ cond (eq $i 0) "true" "false" }}">{{ $e.label }}</button>
      {{- end }}
    </div>
  </div>

  <div class="ft__views" aria-live="off">
    {{- $spec := hugo.Data.release.ergo_spec }}
    {{- range $e := $c.fromto.examples }}
    {{- $ex := index hugo.Data.examples $e.key }}
    {{- $hold := $e.holds }}

    {{- if and $c.fromto.show_rego $ex.rego }}
    <div class="ft__view" data-ex="{{ $e.key }}" data-step="0" data-file="{{ $ex.rego.file }}" data-hold="{{ index $hold 0 }}">
      <p class="ft__label mono"><span class="ft__who">Rego</span> the policy</p>
<pre class="code ft__code"><code>{{ partial "code/rego.html" (dict "text" $ex.rego.policy) | safeHTML }}</code></pre>
    </div>

    <div class="ft__view" data-ex="{{ $e.key }}" data-step="1" data-file="opa eval ... {{ $ex.rego.query }}" data-hold="{{ index $hold 1 }}">
      <p class="ft__label mono"><span class="ft__who">Rego</span> the result</p>
<pre class="code ft__code ft__code--out"><code>{{ partial "code/json.html" (dict "text" $ex.rego.result) | safeHTML }}</code></pre>
      <p class="ft__caption">{{ partial "copy.html" $e.rego_caption }}</p>
    </div>
    {{- end }}

    <div class="ft__view" data-ex="{{ $e.key }}" data-step="2" data-file="policy/policy.yaml" data-hold="{{ index $hold 2 }}">
      <p class="ft__label mono"><span class="ft__who ft__who--ergo">Ergo</span> the policy</p>
<pre class="code ft__code"><code>{{ partial "code/yaml.html" (dict "text" (printf "ergo_spec: %s\n%s" $spec $ex.policy)) | safeHTML }}</code></pre>
    </div>

    <div class="ft__view" data-ex="{{ $e.key }}" data-step="3" data-file="{{ $ex.input_file }}" data-hold="{{ index $hold 3 }}">
      <p class="ft__label mono"><span class="ft__who ft__who--ergo">Ergo</span> the evaluation, reading this input</p>
<pre class="code ft__code"><code>{{ partial "code/json.html" (dict "text" $ex.input) | safeHTML }}</code></pre>
      <p class="ft__caption">{{ partial "copy.html" $e.input_caption }}</p>
    </div>

    <div class="ft__view" data-ex="{{ $e.key }}" data-step="4" data-file="opa eval ... report" data-hold="{{ index $hold 4 }}">
      <p class="ft__label mono"><span class="ft__who ft__who--ergo">Ergo</span> the report</p>
      <div class="report ft__report">
        <div class="report__head"><span>subject</span><span>check</span><span>value read</span><span>passed</span><span>cause</span></div>
        {{- partial "report-rows.html" $ex.report }}
      </div>
      <p class="ft__caption">{{ partial "copy.html" $e.ergo_caption }}</p>
    </div>
    {{- end }}

  </div>

  <div class="term__foot ft__foot">
    <div class="ft__steps" role="group" aria-label="Steps">
      {{- range $i, $s := $c.fromto.steps }}
      {{- if or $c.fromto.show_rego (ge $i 2) }}
      <button type="button" class="ft__step mono" data-step="{{ $i }}" aria-pressed="{{ cond (eq $i 0) "true" "false" }}">
        {{- if lt $i 2 }}<span class="ft__mark ft__mark--rego" aria-hidden="true"></span>{{ else }}<span class="ft__mark ft__mark--ergo" aria-hidden="true">{{ partial "therefore.html" . }}</span>{{ end -}}
        {{ $s }}</button>
      {{- end }}
      {{- end }}
    </div>
  </div>
</figure>
