<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="lockup" href="{{ "/" | relURL }}" aria-label="Ergo home">{{ partial "wordmark.html" . }}</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu"><span></span><span></span><span></span></button>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <a href="{{ "docs/getting-started/" | relURL }}"{{ if eq .RelPermalink ("docs/getting-started/" | relURL) }} aria-current="page"{{ end }}>Get started</a>
      <a href="{{ "docs/reference/" | relURL }}"{{ if eq .RelPermalink ("docs/reference/" | relURL) }} aria-current="page"{{ end }}>Reference</a>
      <a class="btn btn--sm btn--ghost" href="{{ site.Params.repo }}">{{ partial "github-icon.html" . }}GitHub</a>
    </nav>
  </div>
</header>
