name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is not empty
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "$(printf '%s' "$TITLE" | tr -d '[:space:]')" ]; then
            echo "The title is empty. It becomes the commit on main, so it should say what the change does."
            exit 1
          fi
