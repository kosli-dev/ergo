name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.20.2
      - uses: open-policy-agent/setup-regal@v2.0.0
        with:
          version: 0.43.0
      - name: Check the version isn't below the latest release
        shell: bash
        run: |
          version=$(sed -n 's/^version := "\([0-9]*\.[0-9]*\.[0-9]*\)-dev"$/\1/p' engines/rego/ergo.rego)
          if [ -z "$version" ]; then
            echo 'ergo.rego must say version := "X.Y.Z-dev" on main'
            exit 1
          fi
          latest=$(git tag --list 'rego-v*' | grep -E '^rego-v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^rego-v//' | sort -V | tail -n 1 || true)
          if [ -n "$latest" ]; then
            if [ "$latest" = "$version" ]; then
              echo "::warning::ergo.rego says $version-dev, but rego-v$latest is already released. Merge the pull request that moves main to the next version."
              exit 0
            fi
            highest=$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n 1)
            if [ "$highest" != "$version" ]; then
              echo "ergo.rego says $version-dev, but rego-v$latest is already released. Change it to a version above $latest, like the next minor."
              exit 1
            fi
          fi
      - name: Check the spec version moved when the spec changed
        run: .github/spec-version.sh
      - run: opa check --strict engines/rego spec:spec examples:examples
      - name: Check Ergo compiles where input is checked against a closed schema
        run: opa check --strict --schema .github/closed-input-schema.json engines/rego/ergo.rego
      - name: Check Ergo compiles without built-ins whose answer depends on the machine
        run: |
          opa capabilities --current | jq '.builtins |= map(select(.nondeterministic != true))' > "$RUNNER_TEMP/deterministic.json"
          opa check --strict --capabilities "$RUNNER_TEMP/deterministic.json" engines/rego/ergo.rego
      - run: opa fmt --list --fail engines/rego examples engines/rust/sentences/tests/oracle
      - name: Check every folder with Rego is named in the OPA commands
        run: |
          .github/rego-folders.sh
          .github/rego-folders_test.sh
      - name: Check the release workflow's latest flag and release notes
        run: |
          python3 .github/release-latest.py
          .github/release-latest_test.sh
          .github/release-notes_test.sh
      - name: Lint for likely bugs
        run: regal lint --format github --disable-all --enable-category bugs --disable redundant-existence-check engines/rego examples engines/rust/sentences/tests/oracle
      - name: Check there are no comments
        shell: bash
        run: |
          comments=$(git ls-files '*.rego' | while read -r f; do
            opa parse "$f" --format json --json-include comments,locations |
              jq -r --arg f "$f" '.package.location.row as $p | .comments[]? | .Location.row as $r | select(($f == "engines/rego/ergo.rego" and $r < $p) | not) | "\($f):\($r)"'
          done)
          if [ -n "$comments" ]; then
            echo "These lines have comments:"
            echo "$comments"
            exit 1
          fi
      - name: Check the tests give the same results with --strict-builtin-errors
        run: opa eval --strict-builtin-errors -d engines/rego -d spec:spec -d examples:examples --format raw 'count(data) > 0'

  tests-rego:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [1, 2, 3, 4]
    env:
      PART: ${{ matrix.part }}
      PARTS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.20.2
      - name: Run this part of the tests with coverage
        shell: bash
        run: |
          if ! opa test engines/rego spec:spec examples:examples --timeout 120s --coverage -r "$(.github/tests.sh | .github/test-pattern.sh)" > "$RUNNER_TEMP/coverage.json"; then
            cat "$RUNNER_TEMP/coverage.json"
            exit 1
          fi
          jq -e '.files["engines/rego/ergo.rego"]' "$RUNNER_TEMP/coverage.json" > /dev/null
          jq -r '.files | to_entries[] | .key as $f | .value.not_covered[]? | range(.start.row; .end.row + 1) | "\($f):\(.)"' "$RUNNER_TEMP/coverage.json" | sort -u > "$RUNNER_TEMP/not-covered-$PART.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: not-covered-${{ matrix.part }}
          path: ${{ runner.temp }}/not-covered-${{ matrix.part }}.txt

  tests-rego-coverage:
    needs: tests-rego
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: not-covered-*
          merge-multiple: true
          path: not-covered
      - name: Check every line is reached by some part's tests
        shell: bash
        run: |
          files=(not-covered/*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No part sent its coverage"
            exit 1
          fi
          uncovered=$(cat "${files[0]}")
          for f in "${files[@]:1}"; do
            uncovered=$(comm -12 <(echo "$uncovered") "$f")
          done
          uncovered=$(grep -v '^$' <<<"$uncovered" | sort -t: -k1,1 -k2,2n | awk -F: '$1 != f || $2 != r + 1 { print } { f = $1; r = $2 }' || true)
          if [ -n "$uncovered" ]; then
            echo "No test reaches these lines:"
            echo "$uncovered"
            exit 1
          fi

  tests-wasm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [1, 2, 3, 4]
    env:
      PART: ${{ matrix.part }}
      PARTS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.20.2
      - name: Run this part of the tests compiled to Wasm
        run: .github/wasm-tests.sh

  tests-compiled-policy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [1, 2, 3, 4]
    env:
      PART: ${{ matrix.part }}
      PARTS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.20.2
      - name: Run this part of the tests with every report made from a compiled policy
        run: .github/compiled-tests.sh

  tests-wasm-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.20.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run the tests with the Wasm JS runtime
        run: |
          npm install --silent --no-save --prefix "$RUNNER_TEMP" @open-policy-agent/opa-wasm@1.10.0
          node .github/wasm-js.cjs "$RUNNER_TEMP"

  tests-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/rust
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust version in rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features -- --show-output
      - name: Check the API docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features
      - run: cargo test --locked -p ergo-policy-engine --features serde_json/preserve_order --test key_order
      - name: Check ergo-policy-sentences builds for Wasm
        run: cargo build --locked -p ergo-policy-sentences --target wasm32-unknown-unknown
      - name: Install the wasm-bindgen tool, at the version of the crate
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Install Binaryen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/binaryen.tar.gz" https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          tar -xz -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/binaryen.tar.gz"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - name: Build ergo-policy-wasm, wrap it for a browser and shrink it
        run: |
          cargo build --locked --profile wasm -p ergo-policy-wasm --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir wasm/pkg target/wasm32-unknown-unknown/wasm/ergo_policy_wasm.wasm
          wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue wasm/pkg/ergo_policy_wasm_bg.wasm -o wasm/pkg/ergo_policy_wasm_bg.wasm
      - name: Load ergo-policy-wasm in Node and build a report
        run: node wasm/check-node.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: ergo-policy-wasm-pkg
          path: engines/rust/wasm/pkg
      - name: Build ergo-policy-sentences-wasm, wrap it for a browser and shrink it
        run: |
          cargo build --locked --profile wasm -p ergo-policy-sentences-wasm --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir sentences-wasm/pkg target/wasm32-unknown-unknown/wasm/ergo_policy_sentences_wasm.wasm
          wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue sentences-wasm/pkg/ergo_policy_sentences_wasm_bg.wasm -o sentences-wasm/pkg/ergo_policy_sentences_wasm_bg.wasm
      - name: Load ergo-policy-sentences-wasm in Node and read a sentence
        run: node sentences-wasm/check-node.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: ergo-policy-sentences-wasm-pkg
          path: engines/rust/sentences-wasm/pkg

  markdown:
    needs: tests-rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.20.2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: packages/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: packages/.nvmrc
          cache: pnpm
          cache-dependency-path: packages/pnpm-lock.yaml
      - uses: actions/download-artifact@v8
        with:
          name: ergo-policy-wasm-pkg
          path: engines/rust/wasm/pkg
      - uses: actions/download-artifact@v8
        with:
          name: ergo-policy-sentences-wasm-pkg
          path: engines/rust/sentences-wasm/pkg
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm -r bundle

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.20.2
      - name: Check every rule a case cites exists, and every rule has a case
        run: python3 spec/check_rules.py
      - name: Check the corpus JSON matches the markdown
        run: python3 spec/sentences_corpus.py --check
      - name: Install the spec checks' Python packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet jsonschema==4.26.0 abnf==2.9.0
      - name: Check the cases' policies and reports match the schemas
        run: '"$RUNNER_TEMP/venv/bin/python" .github/spec-schemas.py'
      - name: Install the Rust version in rust-toolchain.toml
        working-directory: engines/rust
        run: rustup toolchain install
      - name: Build the Rust sentence reader
        working-directory: engines/rust
        run: cargo build --locked --release -p ergo-policy-sentences --example read
      - name: Check ergo.rego, Rust and the ABNF read the same sentences
        run: '"$RUNNER_TEMP/venv/bin/python" spec/check_grammar.py --rust engines/rust/target/release/examples/read'

  site:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.157.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.20.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Hugo
        run: |
          wget -q -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Test the site's scripts
        run: |
          site/latest-release_test.sh
          site/prepare_test.sh
          site/check_fit_test.sh
          site/check_examples_test.sh
          site/check_build_test.sh
          site/editor_test.sh
      - name: Write what the site needs from this commit
        run: site/prepare.sh --working-tree
      - name: Test this commit's tutorial and home page examples against its ergo.rego
        run: site/check.sh
      - name: Build the site from this commit
        run: |
          hugo --source site --gc --minify --destination "$RUNNER_TEMP/public"
          python3 site/check_build.py "$RUNNER_TEMP/public"
      - name: Write what the site needs from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: site/prepare.sh
      - name: Test the released tutorial, and check it still fits this commit's layouts and CSS
        run: site/check.sh
      - name: Build the site from the latest release
        run: |
          hugo --source site --gc --minify --destination "$RUNNER_TEMP/public-release"
          python3 site/check_build.py "$RUNNER_TEMP/public-release"
