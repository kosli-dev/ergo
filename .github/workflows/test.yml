name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.19.0
      - uses: open-policy-agent/setup-regal@v2.0.0
        with:
          version: 0.43.0
      - run: opa check --strict . --ignore .github
      - run: opa fmt --list --fail .
      - run: opa test . --ignore .github --timeout 30s --verbose
      - name: Lint for likely bugs
        run: regal lint --format github --disable-all --enable-category bugs --disable redundant-existence-check --ignore-files '.github/**' .
      - name: Check there are no comments
        shell: bash
        run: |
          comments=$(git ls-files '*.rego' | while read -r f; do
            opa parse "$f" --format json --json-include comments,locations |
              jq -r --arg f "$f" '.comments[]? | .Location.row as $r | select(($f == "ergo.rego" and $r <= 2) | not) | "\($f):\($r)"'
          done)
          if [ -n "$comments" ]; then
            echo "These lines have comments:"
            echo "$comments"
            exit 1
          fi
      - name: Check the tests give the same results with --strict-builtin-errors
        run: opa eval --strict-builtin-errors --ignore .github -d . --format raw 'count(data) > 0'
      - name: Check every line is tested
        shell: bash
        run: |
          opa test . --ignore .github --timeout 30s --coverage > "$RUNNER_TEMP/coverage.json"
          jq -e '.files["ergo.rego"]' "$RUNNER_TEMP/coverage.json" > /dev/null
          uncovered=$(jq -r '.files | to_entries[] | .key as $f | .value.not_covered[]? | "\($f):\(.start.row)"' "$RUNNER_TEMP/coverage.json" | sort -u)
          if [ -n "$uncovered" ]; then
            echo "No test reaches these lines:"
            echo "$uncovered"
            exit 1
          fi

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.19.0
      - name: Run the tests compiled to Wasm
        run: opa test . --ignore .github --target wasm --timeout 30s

  wasm-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run the tests with the Wasm JS runtime
        run: |
          npm install --silent --no-save --prefix "$RUNNER_TEMP" @open-policy-agent/opa-wasm@1.10.0
          node .github/wasm-js.cjs "$RUNNER_TEMP"

  playground:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.157.0
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Hugo
        run: |
          wget -q -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Build the playground's Wasm
        run: site/build-playground.sh
      - name: Test the playground
        run: node --test site/assets/js/playground/lib.test.mjs
      - name: Build the site
        run: hugo --source site --gc --minify --destination "$RUNNER_TEMP/public"
