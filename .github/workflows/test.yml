name: test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.22.0
      - uses: open-policy-agent/setup-regal@v2.0.0
        with:
          version: 0.43.0
      - name: Check the versions follow the releases and the changelogs
        run: |
          .github/changelog-version.sh rego
          .github/changelog-version.sh rust
      - name: Check the spec version moved when the spec changed
        run: |
          .github/spec-version.sh
          .github/spec-version_test.sh
      - name: Check tests write the spec placeholder, not the version
        run: |
          .github/spec-placeholder.sh
          .github/spec-placeholder_test.sh
      - name: Build dist/ergo.rego from its parts
        run: |
          .github/build-ergo_test.sh
          .github/build-ergo.sh
      - run: opa check --strict engines/rego dist spec:spec examples:examples --ignore src
      - name: Check the marked policy, input and output blocks in the docs by running them
        run: |
          .github/docs-run_test.sh
          .github/docs-run-release_test.sh
          .github/docs-run-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check Ergo compiles where input is checked against a closed schema
        run: opa check --strict --schema .github/closed-input-schema.json dist/ergo.rego
      - name: Check Ergo compiles without built-ins whose answer depends on the machine
        run: |
          opa capabilities --current | jq '.builtins |= map(select(.nondeterministic != true))' > "$RUNNER_TEMP/deterministic.json"
          opa check --strict --capabilities "$RUNNER_TEMP/deterministic.json" dist/ergo.rego
      - run: opa fmt --list --fail engines/rego examples engines/rust/sentences/tests/oracle
      - name: Check every folder with Rego is named in the OPA commands
        run: |
          .github/rego-folders.sh
          .github/rego-folders_test.sh
          python3 .github/rego-layers.py
          .github/rego-layers_test.sh
      - name: Check no Rust source file holds an inline test module
        run: |
          .github/no-inline-tests.sh
          .github/no-inline-tests_test.sh
      - name: Check no JSON file OPA loads as data is an array
        run: |
          .github/no-array-data.sh
          .github/no-array-data_test.sh
      - name: Check the script that compares two dumps of the Rust engine's reports
        run: .github/dump-diff_test.sh
      - name: Check the script that lists what a change did to the Rust engine's reports
        run: .github/pr-facts_test.sh
      - name: Check the script that lists the new tests that pass on the old source
        run: .github/red-check_test.sh
      - name: Check the script that lists what a change did to the policy and input pairs
        run: .github/pairs-facts_test.sh
      - name: Check the script that lists what cargo-mutants misses on the changed Rust lines
        run: .github/mutants-facts_test.sh
      - name: Check the script that lists what a change did to the matrix pairs
        run: .github/matrix-facts_test.sh
      - name: Check that ergo.rego reads every pair the for generator writes
        run: .github/matrix/for_test.sh
      - name: Check the script that compares the pull request body with the report facts
        run: .github/body-facts_test.sh
      - name: Check the script that reports how far the engines are from the spec
        run: .github/sync-facts_test.sh
      - name: Check the script that sorts the known failures by what differs
        run: .github/diff-types_test.sh
      - name: Check the script that counts the places that cut a message as text
        run: .github/message-cuts_test.sh
      - name: Check that engine code cuts no more messages as text than the base branch
        if: github.event_name == 'pull_request'
        run: .github/message-cuts.sh --against origin/${{ github.base_ref }}
      - name: Check the script that finds spec rules
        run: .github/rules_test.sh
      - name: Check that the merge drivers in .gitattributes work
        run: .github/gitattributes_test.sh
      - name: Check the script that runs the common checks
        run: .github/checks_test.sh
      - name: Check the release workflow's latest flag, release notes and tag checks
        run: |
          python3 .github/release-latest.py
          .github/release-latest_test.sh
          .github/release-notes_test.sh
          .github/release_test.sh
          .github/changelog-version_test.sh
      - name: Check the compiled-policy tests run in batches
        run: .github/compiled-tests_test.sh
      - name: Check the property check
        run: .github/property-check_test.sh
      - name: Lint for likely bugs
        run: regal lint --format github --disable-all --enable-category bugs --disable redundant-existence-check engines/rego examples engines/rust/sentences/tests/oracle
      - name: Check there are no comments
        shell: bash
        run: |
          comments=$(git ls-files '*.rego' | while read -r f; do
            opa parse "$f" --format json --json-include comments,locations |
              jq -r --arg f "$f" '.package.location.row as $p | .comments[]? | .Location.row as $r | select(($f == "engines/rego/src/package.rego" and $r < $p) | not) | "\($f):\($r)"'
          done)
          if [ -n "$comments" ]; then
            echo "These lines have comments:"
            echo "$comments"
            exit 1
          fi

  tests-strict-builtin-errors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.22.0
      - name: Build dist/ergo.rego from its parts
        run: .github/build-ergo.sh
      - name: Check the tests give the same results with --strict-builtin-errors
        run: opa eval --strict-builtin-errors -d engines/rego -d dist -d spec:spec -d examples:examples --ignore src --format raw 'count(data) > 0'

  tests-rego:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        part: [1, 2, 3, 4, 5]
    env:
      PART: ${{ matrix.part }}
      PARTS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.22.0
      - name: Run this part of the tests with coverage
        shell: bash
        run: |
          .github/build-ergo.sh
          if ! opa test engines/rego dist spec:spec examples:examples --ignore src --timeout 240s --coverage -r "$(.github/tests.sh | .github/test-pattern.sh)" > "$RUNNER_TEMP/coverage.json"; then
            cat "$RUNNER_TEMP/coverage.json"
            exit 1
          fi
          jq -e '.files["dist/ergo.rego"]' "$RUNNER_TEMP/coverage.json" > /dev/null
          jq -r '.files | to_entries[] | .key as $f | .value.not_covered[]? | range(.start.row; .end.row + 1) | "\($f):\(.)"' "$RUNNER_TEMP/coverage.json" | .github/build-ergo.sh where | sort -u > "$RUNNER_TEMP/not-covered-$PART.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: not-covered-${{ matrix.part }}
          path: ${{ runner.temp }}/not-covered-${{ matrix.part }}.txt

  tests-rego-coverage:
    needs: tests-rego
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: not-covered-*
          merge-multiple: true
          path: not-covered
      - name: Check every line is reached by some part's tests
        shell: bash
        run: |
          files=(not-covered/*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No part sent its coverage"
            exit 1
          fi
          uncovered=$(cat "${files[0]}")
          for f in "${files[@]:1}"; do
            uncovered=$(comm -12 <(echo "$uncovered") "$f")
          done
          uncovered=$(grep -v '^$' <<<"$uncovered" | sort -t: -k1,1 -k2,2n | awk -F: '$1 != f || $2 != r + 1 { print } { f = $1; r = $2 }' || true)
          if [ -n "$uncovered" ]; then
            echo "No test reaches these lines:"
            echo "$uncovered"
            exit 1
          fi

  tests-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - name: Paused until OPA closes the engines of Wasm tests (open-policy-agent/opa#9513)
        run: echo "Wasm tests are paused"

  tests-compiled-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.22.0
      - name: Run the tests with every report made from a compiled policy
        run: .github/compiled-tests.sh

  tests-wasm-js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run the tests with the Wasm JS runtime
        run: |
          npm install --silent --no-save --prefix "$RUNNER_TEMP" @open-policy-agent/opa-wasm@1.10.0
          node .github/wasm-js.cjs "$RUNNER_TEMP"

  tests-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: engines/rust
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust version in rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features -- --show-output
      - name: Check the API docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features
      - run: cargo test --locked -p ergo-policy-engine --features serde_json/preserve_order --test key_order
      - name: Check ergo-policy-sentences builds for Wasm
        run: cargo build --locked -p ergo-policy-sentences --target wasm32-unknown-unknown
      - name: Install the wasm-bindgen tool, at the version of the crate
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Install Binaryen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/binaryen.tar.gz" https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          tar -xz -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/binaryen.tar.gz"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - name: Build ergo-policy-wasm, wrap it for a browser and shrink it
        run: |
          cargo build --locked --profile wasm -p ergo-policy-wasm --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir wasm/pkg target/wasm32-unknown-unknown/wasm/ergo_policy_wasm.wasm
          wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue wasm/pkg/ergo_policy_wasm_bg.wasm -o wasm/pkg/ergo_policy_wasm_bg.wasm
      - name: Load ergo-policy-wasm in Node and build a report
        run: node wasm/check-node.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: ergo-policy-wasm-pkg
          path: engines/rust/wasm/pkg
      - name: Build ergo-policy-sentences-wasm, wrap it for a browser and shrink it
        run: |
          cargo build --locked --profile wasm -p ergo-policy-sentences-wasm --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir sentences-wasm/pkg target/wasm32-unknown-unknown/wasm/ergo_policy_sentences_wasm.wasm
          wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue sentences-wasm/pkg/ergo_policy_sentences_wasm_bg.wasm -o sentences-wasm/pkg/ergo_policy_sentences_wasm_bg.wasm
      - name: Load ergo-policy-sentences-wasm in Node and read a sentence
        run: node sentences-wasm/check-node.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: ergo-policy-sentences-wasm-pkg
          path: engines/rust/sentences-wasm/pkg

  rust-report-facts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the Rust version in rust-toolchain.toml
        run: |
          cd engines/rust
          rustup toolchain install
      - name: Write what the change did to the Rust engine's reports in the job summary
        env:
          BASE: origin/${{ github.base_ref }}
        run: .github/pr-facts.sh "$BASE" >> "$GITHUB_STEP_SUMMARY"
      - name: Write how far the engines are from the spec in the job summary
        env:
          BASE: origin/${{ github.base_ref }}
          SYNC_FACTS_TYPES: "1"
        run: .github/sync-facts.sh "$BASE" >> "$GITHUB_STEP_SUMMARY"

  pairs-facts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.22.0
      - name: Install the Rust version in rust-toolchain.toml
        run: |
          cd engines/rust
          rustup toolchain install
      - name: Write what the change did to the policy and input pairs in the job summary
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          if git diff --quiet "$BASE...HEAD" -- engines/rust engines/rego spec .github/pairs-facts.sh; then
            echo "No file under engines/rust, engines/rego or spec changed." >> "$GITHUB_STEP_SUMMARY"
          else
            .github/pairs-facts.sh "$BASE" >> "$GITHUB_STEP_SUMMARY"
          fi

  mutants-facts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the Rust version in rust-toolchain.toml
        run: |
          cd engines/rust
          rustup toolchain install
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked --version 27.1.0
      - name: Write what cargo-mutants misses on the changed Rust lines in the job summary
        env:
          BASE: origin/${{ github.base_ref }}
        run: .github/mutants-facts.sh "$BASE" >> "$GITHUB_STEP_SUMMARY"

  matrix-facts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.22.0
      - name: Install the Rust version in rust-toolchain.toml
        run: |
          cd engines/rust
          rustup toolchain install
      - name: Write what the change did to the pairs of matrix-a, matrix-b, walk and for in the job summary
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          if git diff --quiet "$BASE...HEAD" -- engines/rust engines/rego spec .github/matrix .github/matrix-facts.sh; then
            echo "No file under engines/rust, engines/rego or spec changed." >> "$GITHUB_STEP_SUMMARY"
          else
            .github/matrix-facts.sh "$BASE" matrix-a matrix-b walk for >> "$GITHUB_STEP_SUMMARY"
          fi

  body-facts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.22.0
      - name: Install the Rust version in rust-toolchain.toml
        continue-on-error: true
        run: |
          cd engines/rust
          rustup toolchain install
      - name: Work out the report and pair facts
        continue-on-error: true
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          .github/pr-facts.sh "$BASE" > "$RUNNER_TEMP/pr-facts.md"
          if git diff --quiet "$BASE...HEAD" -- engines/rust engines/rego spec .github/pairs-facts.sh; then
            echo "No file under engines/rust, engines/rego or spec changed." > "$RUNNER_TEMP/pairs-facts.md"
          else
            .github/pairs-facts.sh "$BASE" > "$RUNNER_TEMP/pairs-facts.md"
          fi
      - name: Write the report counts in the job summary, warn when the body lacks Changes the report, and fail when a number in the body differs from them
        env:
          BODY_FACTS_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          .github/body-facts.sh "$RUNNER_TEMP/pr-facts.md" "$RUNNER_TEMP/pairs-facts.md" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  red-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.22.0
      - name: Install the Rust version in rust-toolchain.toml
        run: |
          cd engines/rust
          rustup toolchain install
      - name: Write the new tests that already pass on the old source in the job summary
        env:
          BASE: origin/${{ github.base_ref }}
        run: .github/red-check.sh "$BASE" >> "$GITHUB_STEP_SUMMARY"

  playground:
    needs: tests-rust
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.22.0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: packages/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: packages/.nvmrc
          cache: pnpm
          cache-dependency-path: packages/pnpm-lock.yaml
      - uses: actions/download-artifact@v8
        with:
          name: ergo-policy-wasm-pkg
          path: engines/rust/wasm/pkg
      - uses: actions/download-artifact@v8
        with:
          name: ergo-policy-sentences-wasm-pkg
          path: engines/rust/sentences-wasm/pkg
      - name: Build dist/ergo.rego from its parts
        working-directory: .
        run: .github/build-ergo.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm -r bundle

  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.22.0
      - name: Check every rule a case cites exists, and every rule has a case
        run: python3 spec/check_rules.py
      - name: Check the sweep's list of pairs option
        run: python3 spec/sweep_test.py
      - name: Check the corpus JSON matches the markdown
        run: python3 spec/sentences_corpus.py --check
      - name: Install the spec checks' Python packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet jsonschema==4.26.0 abnf==2.9.0
      - name: Check the cases' policies and reports match the schemas
        run: '"$RUNNER_TEMP/venv/bin/python" .github/spec-schemas.py'
      - name: Install the Rust version in rust-toolchain.toml
        working-directory: engines/rust
        run: rustup toolchain install
      - name: Build the Rust sentence reader
        working-directory: engines/rust
        run: cargo build --locked --release -p ergo-policy-sentences --example read
      - name: Check ergo.rego, Rust and the ABNF read the same sentences
        run: '"$RUNNER_TEMP/venv/bin/python" spec/check_grammar.py --rust engines/rust/target/release/examples/read'

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      HUGO_VERSION: 0.157.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Hugo
        run: |
          wget -q -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Test the site's scripts
        run: |
          site/latest-release_test.sh
          site/prepare-playground_test.sh
          .github/pages-source_test.sh
          site/prepare_test.sh
          site/check_fit_test.sh
          site/check_examples_test.sh
          site/check_build_test.sh
          site/playground_test.sh
      - name: Write what the site needs from this commit
        run: site/prepare.sh --working-tree
      - name: Test this commit's tutorial and home page examples against its ergo.rego
        run: site/check.sh
      - name: Build the site from this commit
        run: |
          hugo --source site --gc --minify --destination "$RUNNER_TEMP/public"
          python3 site/check_build.py "$RUNNER_TEMP/public"
      - name: Write what the site needs from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: site/prepare.sh
      - name: Test the released tutorial, and check it still fits this commit's layouts and CSS
        run: site/check.sh
      - name: Build the site from the latest release
        run: |
          hugo --source site --gc --minify --destination "$RUNNER_TEMP/public-release"
          python3 site/check_build.py "$RUNNER_TEMP/public-release"
