# Deploys site/ to GitHub Pages once the test workflow passes on main.
# Keys here must not overlap test.yml's: `opa check .` loads every YAML file as data.
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
      actions: read
    env:
      HUGO_VERSION: 0.157.0
    steps:
      - name: Install Hugo
        shell: bash
        run: |
          wget -q -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.20.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Write what the site needs from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: site/prepare.sh
      - name: Test the released tutorial and home page examples before publishing them
        run: site/check.sh
      - name: Find the test run that built the Wasm
        id: tests
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yml --commit "$SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful test run for $SHA, so there is no Wasm for the editor. Run this workflow on a commit of main whose tests passed."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ergo-wasm-pkg
          path: ports/rust/wasm/pkg
          run-id: ${{ steps.tests.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ergo-sentences-wasm-pkg
          path: ports/rust/sentences-wasm/pkg
          run-id: ${{ steps.tests.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: pnpm/action-setup@v6
        continue-on-error: true
        with:
          package_json_file: packages/package.json
      - uses: actions/setup-node@v7
        continue-on-error: true
        with:
          node-version-file: packages/.nvmrc
          cache: pnpm
          cache-dependency-path: packages/pnpm-lock.yaml
      - name: Build the editor
        continue-on-error: true
        working-directory: packages
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @kosli/ergo-editor build
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build
        shell: bash
        run: |
          hugo --source site --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
          if [ -f packages/editor/dist/editor.html ]; then
            site/editor.sh packages/editor/dist/editor.html site/public
          else
            echo "::warning::The editor wasn't built, so the site is deployed without /editor/."
          fi
          python3 site/check_build.py site/public
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
