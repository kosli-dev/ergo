version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 10
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
      day: "tuesday"
      time: "11:00"
    commit-message:
      prefix: "ci"
    # Group minor and patch updates
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependabot"
      - "dependencies"
      - "github-actions"
  # Rust
  - package-ecosystem: "cargo"
    open-pull-requests-limit: 10
    directory: "/ports/rust"
    schedule:
      # Check for updates to Rust dependencies every week
      interval: "weekly"
      day: "tuesday"
      time: "11:00"
    commit-message:
      prefix: "rust"
    # Group minor and patch updates
    groups:
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependabot"
      - "dependencies"
      - "rust"

  # Node packages under packages/
  - package-ecosystem: "npm"
    open-pull-requests-limit: 10
    directory: "/packages"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "11:00"
    commit-message:
      prefix: "markdown"
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependabot"
      - "dependencies"
